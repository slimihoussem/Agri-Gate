# ─────────────────────────────────────────────────────────────────────────────
# AgriGate Mosquitto broker — LOCAL DEVELOPMENT ONLY
#
# ⚠ PRODUCTION (Part 11) REQUIRES:
#   - authentication (password_file / plugin) — allow_anonymous must be false
#   - TLS on both listeners (listener 8883 certfile/keyfile, wss:// for 9001)
#   - per-node ACLs so a node can only publish under its own farm subtree
# ─────────────────────────────────────────────────────────────────────────────

# MQTT listener for the ingest service and field nodes
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener — reserved for Part 7 frontend live updates
listener 9001
protocol websockets
allow_anonymous true

persistence false
log_dest stdout
