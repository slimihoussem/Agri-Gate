version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: agrigat-timescaledb
    restart: unless-stopped
    ports:
      # Host port 5433: a local Windows PostgreSQL service already occupies
      # 5432, which would silently shadow the container connection.
      - "5433:5432"
    environment:
      POSTGRES_USER: agrigat_user
      POSTGRES_PASSWORD: agrigat_secret_pwd
      POSTGRES_DB: agrigat_db
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrigat_user -d agrigat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: agrigat-mosquitto
    restart: unless-stopped
    ports:
      # Host ports 1884/9002: a local Windows Mosquitto service already
      # occupies 1883/9001, which would silently shadow these connections.
      - "1884:1883" # MQTT (ingest service, field nodes)
      - "9002:9001" # WebSocket listener — reserved for Part 7 frontend live updates
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    healthcheck:
      # $$ escapes $ in compose; -W bounds the wait so the check never hangs.
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 5"]
      interval: 10s
      timeout: 6s
      retries: 5

volumes:
  timescaledb_data:
    driver: local
